<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nebula DevOS</title>

    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <style>
        body {
            background: radial-gradient(#020024 0%, #090979 40%, #4B0082 70%, #8A2BE2 100%);
            color: #f8fafc;
            min-height: 100vh;
        }

        .glass-panel {
            background: rgba(30, 41, 59, 0.45);
            backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.08);
        }
    </style>
</head>
<body class="p-6 md:p-10 max-w-[1500px] mx-auto">

    <!-- Header -->
    <header class="flex justify-between items-center mb-8">
        <div>
            <h1 class="text-3xl font-extrabold text-transparent bg-clip-text bg-gradient-to-r from-indigo-400 to-pink-400">
                Nebula DevOS
            </h1>
            <p class="text-slate-400 text-sm">Track everything you build.</p>
        </div>

        <span class="inline-flex items-center gap-2 px-3 py-1.5 rounded-full text-xs font-semibold bg-emerald-500/10 text-emerald-400 border border-emerald-500/20">
            <span class="w-2 h-2 rounded-full bg-emerald-400 animate-pulse"></span> Backend Connected
        </span>
    </header>

    <!-- Top GitHub Sync Bar (Single Instance) -->
    <form id="github-form" class="mb-6 p-4 rounded-xl bg-slate-900/60 border border-slate-800 flex gap-2">
        <input 
            type="text" 
            id="github-username" 
            placeholder="Enter GitHub username (e.g. torvalds)..." 
            required
            class="flex-1 px-3 py-2 text-xs rounded-lg bg-slate-950 border border-slate-700 text-slate-200 focus:outline-none focus:border-cyan-400"
        />
        <button 
            type="submit" 
            class="px-4 py-2 text-xs font-bold rounded-lg bg-cyan-400 text-slate-950 hover:bg-cyan-300 transition-all flex items-center gap-1"
        >
            Sync GitHub
        </button>
    </form>

    <!-- Top Stats Bar -->
    <div class="grid grid-cols-2 md:grid-cols-4 gap-4 mb-8">
        <div class="glass-panel p-5 rounded-2xl">
            <p class="text-xs text-slate-400 font-medium uppercase">Total Repos</p>
            <h3 id="stat-repos" class="text-2xl font-bold mt-1">0</h3>
        </div>
        <div class="glass-panel p-5 rounded-2xl">
            <p class="text-xs text-slate-400 font-medium uppercase">Active Builds</p>
            <h3 id="stat-active" class="text-2xl font-bold mt-1">0</h3>
        </div>
        <div class="glass-panel p-5 rounded-2xl">
            <p class="text-xs text-slate-400 font-medium uppercase">Hackathon Wins</p>
            <h3 id="stat-wins" class="text-2xl font-bold mt-1">0</h3>
        </div>
        <div class="glass-panel p-5 rounded-2xl">
            <p class="text-xs text-slate-400 font-medium uppercase">Ideas Vault</p>
            <h3 id="stat-ideas" class="text-2xl font-bold mt-1">0</h3>
        </div>
    </div>

    <!-- Main Dashboard Grid (3 Columns) -->
    <main class="grid grid-cols-1 lg:grid-cols-3 gap-6">

        <!-- LEFT COLUMN (Spans 2 Columns): Active Projects + Hackathons -->
        <div class="lg:col-span-2 space-y-6">

            <!-- 1. Active Projects Box -->
            <section class="glass-panel p-6 rounded-2xl">
                <h2 class="text-lg font-bold text-slate-200 mb-4 flex items-center gap-2">
                    <i class="fa-solid fa-folder-open text-cyan-400"></i> Active Projects
                </h2>

                <!-- Dynamic Tech Tag Filter Pills Container -->
                <div id="tag-filters" class="flex flex-wrap gap-2 mb-4"></div>

                <!-- Projects Feed -->
                <div id="projects-container" class="grid grid-cols-1 md:grid-cols-2 gap-4">
                    <p class="text-slate-500 text-sm">Loading projects...</p>
                </div>
            </section>

            <!-- 2. Hackathons Box (Takes full width equal to Active Projects above) -->
            <section class="glass-panel p-6 rounded-2xl space-y-4">
                <h2 class="text-lg font-bold text-slate-200 flex items-center gap-2">
                    <i class="fa-solid fa-stopwatch text-amber-400"></i> Hackathons
                </h2>

<!-- Embedded Quick Add Hackathon Form -->
<form id="hackathon-form" class="p-4 rounded-xl bg-slate-900/60 border border-slate-800 space-y-4">
    <h3 class="text-xs font-bold text-slate-300 uppercase tracking-wider flex items-center gap-2">
        <span>➕ Add New Event</span>
    </h3>
    
    <div class="grid grid-cols-1 sm:grid-cols-2 gap-3">
        <!-- Event Name -->
        <input 
            type="text" 
            id="hackathon-name" 
            placeholder="Hackathon Name (e.g. Quantum Hacks 3.0)..." 
            required
            class="w-full px-3 py-2 text-xs rounded-lg bg-slate-950 border border-slate-700 text-slate-200 focus:outline-none focus:border-cyan-400"
        />

        <!-- Platform Select Dropdown -->
        <select 
            id="hackathon-platform" 
            class="w-full px-3 py-2 text-xs rounded-lg bg-slate-950 border border-slate-700 text-slate-200 focus:outline-none focus:border-cyan-400"
        >
            <option value="devfolio">Devfolio</option>
            <option value="devpost">Devpost</option>
            <option value="unstop">Unstop</option>
            <option value="mlh">MLH</option>
            <option value="other">Other Platform</option>
        </select>
    </div>

    <!-- Tags & Event Link Inputs -->
    <div class="grid grid-cols-1 sm:grid-cols-2 gap-3">
        <input 
            type="text" 
            id="hackathon-tags" 
            placeholder="Tags (comma separated, e.g. AI Agents, Next.js)..." 
            class="w-full px-3 py-2 text-xs rounded-lg bg-slate-950 border border-slate-700 text-slate-200 focus:outline-none focus:border-cyan-400"
        />
        <input 
            type="url" 
            id="hackathon-url" 
            placeholder="Event URL (e.g. https://devpost.com/)..." 
            class="w-full px-3 py-2 text-xs rounded-lg bg-slate-950 border border-slate-700 text-slate-200 focus:outline-none focus:border-cyan-400"
        />
    </div>

    <!-- Start & End Date Pickers -->
    <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
        <div class="space-y-1">
            <label class="block text-[10px] text-slate-400 font-semibold uppercase">Start Date</label>
            <div class="grid grid-cols-3 gap-1">
                <select id="start-day" class="px-2 py-1.5 text-xs rounded-lg bg-slate-950 border border-slate-700 text-slate-200 focus:outline-none focus:border-cyan-400"><option value="">Day</option></select>
                <select id="start-month" class="px-2 py-1.5 text-xs rounded-lg bg-slate-950 border border-slate-700 text-slate-200 focus:outline-none focus:border-cyan-400">
                    <option value="">Month</option>
                    <option value="01">Jan</option><option value="02">Feb</option><option value="03">Mar</option>
                    <option value="04">Apr</option><option value="05">May</option><option value="06">Jun</option>
                    <option value="07">Jul</option><option value="08">Aug</option><option value="09">Sep</option>
                    <option value="10">Oct</option><option value="11">Nov</option><option value="12">Dec</option>
                </select>
                <select id="start-year" class="px-2 py-1.5 text-xs rounded-lg bg-slate-950 border border-slate-700 text-slate-200 focus:outline-none focus:border-cyan-400">
                    <option value="2026">2026</option><option value="2027">2027</option>
                </select>
            </div>
        </div>

        <div class="space-y-1">
            <label class="block text-[10px] text-slate-400 font-semibold uppercase">End Date</label>
            <div class="grid grid-cols-3 gap-1">
                <select id="end-day" class="px-2 py-1.5 text-xs rounded-lg bg-slate-950 border border-slate-700 text-slate-200 focus:outline-none focus:border-cyan-400"><option value="">Day</option></select>
                <select id="end-month" class="px-2 py-1.5 text-xs rounded-lg bg-slate-950 border border-slate-700 text-slate-200 focus:outline-none focus:border-cyan-400">
                    <option value="">Month</option>
                    <option value="01">Jan</option><option value="02">Feb</option><option value="03">Mar</option>
                    <option value="04">Apr</option><option value="05">May</option><option value="06">Jun</option>
                    <option value="07">Jul</option><option value="08">Aug</option><option value="09">Sep</option>
                    <option value="10">Oct</option><option value="11">Nov</option><option value="12">Dec</option>
                </select>
                <select id="end-year" class="px-2 py-1.5 text-xs rounded-lg bg-slate-950 border border-slate-700 text-slate-200 focus:outline-none focus:border-cyan-400">
                    <option value="2026">2026</option><option value="2027">2027</option>
                </select>
            </div>
        </div>
    </div>

    <button type="submit" class="w-full bg-cyan-400 hover:bg-cyan-300 text-slate-950 text-xs font-bold py-2 px-4 rounded-lg transition-all shadow-md">
        + Add Hackathon
    </button>
</form>

                <!-- Hackathons Feed Container -->
                <div id="hackathons-container" class="space-y-3">
                    <p class="text-slate-500 text-sm">Loading hackathons...</p>
                </div>
            </section>

        </div>

        <!-- RIGHT COLUMN (Spans 1 Column): Ideas Vault filling side space -->
        <div class="lg:col-span-1">
            <section class="glass-panel p-6 rounded-2xl space-y-4">
                <h2 class="text-lg font-bold text-slate-200 flex items-center gap-2">
                    <i class="fa-solid fa-lightbulb text-pink-400"></i> Ideas Vault
                </h2>

                <!-- Quick Add Idea Form -->
                <form id="idea-form" class="space-y-2">
                    <input 
                        type="text" 
                        id="idea-title" 
                        placeholder="New Idea title..." 
                        required
                        class="w-full px-3 py-2 text-xs rounded-lg bg-slate-900/60 border border-slate-700/50 text-slate-200 focus:outline-none focus:border-pink-500/50"
                    />

                    <input 
                        type="text" 
                        id="idea-note" 
                        placeholder="Short description / note (optional)..." 
                        class="w-full px-3 py-2 text-xs rounded-lg bg-slate-900/60 border border-slate-700/50 text-slate-200 focus:outline-none focus:border-pink-500/50"
                    />
                    
                    <div class="flex gap-2">
                        <select 
                            id="idea-priority" 
                            class="px-2 py-1.5 text-xs rounded-lg bg-slate-900/60 border border-slate-700/50 text-slate-300 focus:outline-none focus:border-pink-500/50"
                        >
                            <option value="Low">Low</option>
                            <option value="Medium" selected>Medium</option>
                            <option value="High">High</option>
                        </select>
                        
                        <button 
                            type="submit" 
                            class="flex-1 bg-pink-500/20 hover:bg-pink-500/30 text-pink-300 text-xs font-semibold py-1.5 px-3 rounded-lg border border-pink-500/30 transition-all"
                        >
                            + Add Idea
                        </button>
                    </div>
                </form>

                <!-- Ideas List Container -->
                <div id="ideas-container" class="space-y-3">
                    <p class="text-slate-500 text-sm">Loading ideas...</p>
                </div>
            </section>
        </div>

    </main>

    <script src="app.js"></script>
</body>
</html>
